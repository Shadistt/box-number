name: BoxNo
options:
  bundleIdPrefix: co.boxnumber
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 2P3PUF975G
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  BoxNo:
    type: application
    platform: iOS
    sources: [BoxNo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.boxnumber.app
        INFOPLIST_FILE: BoxNo/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BoxNo/Resources/BoxNo.entitlements
      configs:
        Release:
          # Архив сразу подписываем сертификатом распространения (общий, облачный),
          # иначе каждый одноразовый сборщик CI создаёт новый сертификат разработчика.
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ""

        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
